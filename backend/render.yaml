
services:
  - type: web
    name: backend
    env: node
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: your-supabase-url  # Add any other necessary environment variables here
      - key: SUPABASE_KEY
        value: your-supabase-key  # Add the key or any other env variables you need
